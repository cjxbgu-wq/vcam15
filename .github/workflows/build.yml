name: Build VCam APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # allow manual trigger from GitHub web UI

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r26c
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.3.11579264" \
            "cmake;3.22.1" \
            "build-tools;34.0.0" \
            "platforms;android-35"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug keystore (for signing)
        run: |
          keytool -genkey -v \
            -keystore debug.jks \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=VCam,OU=Android,O=VCam,L=Beijing,S=Beijing,C=CN"

      - name: Build release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          ./gradlew assembleRelease \
            -Pandroid.ndkVersion=26.3.11579264 \
            --no-daemon --stacktrace 2>&1 | tail -100

      - name: Sign APK with debug key
        run: |
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks debug.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/vcam15-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcam15-apk
          path: app/build/outputs/apk/release/vcam15-signed.apk
          retention-days: 30

      - name: Print APK info
        run: |
          ls -lh app/build/outputs/apk/release/
          $ANDROID_SDK_ROOT/build-tools/34.0.0/aapt dump badging \
            app/build/outputs/apk/release/vcam15-signed.apk | head -5
